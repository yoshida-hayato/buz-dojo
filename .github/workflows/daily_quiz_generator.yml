name: Daily Quiz Generator

on:
  schedule:
    # UTC 23:00 = JST 08:00（日本時間 毎朝8時）
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ファイル保存せず API のみテスト（true/false）"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-quiz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run multi-agent pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/agents/pipeline.py --dry-run
          else
            python scripts/agents/pipeline.py
          fi

      - name: Create Pull Request
        if: github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(quiz): auto-generated quiz and marketing content"
          title: "🤖 Auto: Daily quiz & marketing content"
          body: |
            ## Summary
            マルチエージェントパイプラインが生成したクイズ JSON とマーケティングコンテンツです。

            - `src/data/quizzes/` — クイズデータ
            - `marketing/note/` — note 用記事
            - `marketing/shorts/` — YouTube Shorts 台本

            ## Review checklist
            - [ ] 正解が1つに定まるか
            - [ ] 解説の事実関係
            - [ ] 既存アプリへの影響なし（Hosting 対象外ディレクトリ）

            _Generated by GitHub Actions `daily_quiz_generator.yml`_
          branch: auto/quiz-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            src/data/quizzes/
            marketing/
