name: Apply Patch from Slack

# Cowork のスケジュールタスク（Claude）が Slack に投稿した改善パッチを取り込み、
# テストが通った場合のみ main に反映する。
#
# 必要な設定:
#   Secrets: SLACK_BOT_TOKEN（xoxb- で始まるボットトークン）
#   ボットは #buz-dojo-agent に招待されている必要がある

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # ブリッジのpushでは deploy.yml が起動しないため、デプロイを明示的に起動する権限
  actions: write


concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: C0C34F5M1QV
      # このユーザーが投稿したパッチだけを受け付ける（他人による混入を防ぐ）
      ALLOWED_SLACK_USER_ID: U0C37AGEFKQ
      # 1回の実行で処理するパッチの最大件数（apply_patch.py の既定値は5）
      MAX_PATCHES_PER_RUN: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          npm install --prefix functions
          npm install
          rm -f package-lock.json
          git checkout -- functions/package-lock.json

      - name: Configure git identity
        run: |
          git config user.name "Auto Improve Agent"
          git config user.email "auto-improve@users.noreply.github.com"

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply patch from Slack
        run: python scripts/bridge/apply_patch.py

      - name: Push commit (if any)
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ steps.base.outputs.sha }}" ]; then
            echo "新しいコミットはありません"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN による push では on: push のワークフローが起動しない(GitHubの仕様)。
      # workflow_dispatch は例外的に起動できるので、pushした回だけデプロイを呼ぶ。
      - name: Trigger deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
