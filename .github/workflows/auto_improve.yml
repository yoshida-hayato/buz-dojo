name: Auto Improve

# リポジトリを定期的にスキャンし、改善候補を出す（propose）か、
# 1件実装してテストが通ればコミットする（apply）。
#
# モードの切り替えはコード変更不要:
#   Settings → Secrets and variables → Actions → Variables に
#   IMPROVE_MODE = apply を作ると実装モードになる（未設定なら propose）。

on:
  schedule:
    # UTC 0/6/12/18時 = JST 9/15/21/3時（1日4回）
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "propose(提案のみ) / apply(実装してコミット)"
        required: false
        default: "propose"
        type: choice
        options:
          - propose
          - apply

permissions:
  contents: write

concurrency:
  group: auto-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    env:
      IMPROVE_MODE: ${{ github.event.inputs.mode || vars.IMPROVE_MODE || 'propose' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # apply モードのときだけ、テスト実行用の依存を入れる（実行時間の節約）
      - name: Set up Node (apply only)
        if: env.IMPROVE_MODE == 'apply'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies (apply only)
        if: env.IMPROVE_MODE == 'apply'
        run: |
          npm install --prefix functions
          npm install

      - name: Configure git identity
        run: |
          git config user.name "Auto Improve Agent"
          git config user.email "auto-improve@users.noreply.github.com"

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run improve agent
        run: python scripts/improve/agent.py

      - name: Push commit (if any)
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ steps.base.outputs.sha }}" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "新しいコミットはありません"
            exit 0
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          if [ -f improve-report.md ]; then
            cat improve-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "レポートが生成されませんでした。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMITTED: ${{ steps.push.outputs.committed }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          path = "improve-report.md"
          report = open(path, encoding="utf-8").read() if os.path.exists(path) else "レポートなし"
          if len(report) > 3500:
              report = report[:3500] + "\n\n…(以下省略。詳細はActionsのSummaryを参照)"

          committed = os.environ.get("COMMITTED") == "true"
          head = "🤖 自動改善エージェント " + (
              "— mainに変更を反映しました" if committed else "— 今回の変更はありません"
          )
          text = f"{head}\n\n{report}\n\n<{os.environ['RUN_URL']}|実行ログを開く>"

          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps({"text": text}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as res:
              print("slack:", res.status)
          PY
